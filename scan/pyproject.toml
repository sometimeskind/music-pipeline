[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "music-pipeline-scan"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = ["music-pipeline-fetch"]

[project.scripts]
music-scan = "music_scan.cli:main"
music-mb-fingerprint = "music_scan.mb_fingerprint:main"
music-backfill-ids = "music_scan.backfill:main"
music-audit-lengths = "music_scan.audit:main"
music-embed-covers = "music_scan.cover:main"
music-canon-albums = "music_scan.canon:main"
music-audit-dupes = "music_scan.dupes:main"
music-rollback-releases = "music_scan.rollback:main"
music-album-audit-releases = "music_scan.release:audit_main"
music-audit-want-albums = "music_scan.want_albums:main"
music-album-rekey = "music_scan.restamp:main"
music-cutover = "music_scan.cutover:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["music_scan*"]


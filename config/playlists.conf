# Playlist registry — one entry per line.
# Format: <name> <spotify-url> [nosync|album]
#   name        slug used as the playlist store and .m3u filename and the beets source tag.
#               Use lowercase letters, numbers, and hyphens only.
#   spotify-url full Spotify playlist URL (not a secret — safe to commit)
#   nosync      optional flag: if present, music-ingest creates a .nosync sentinel
#               on the PVC and skips spotdl sync for this playlist (its store is
#               read from Spotify once). Remove the flag to unfreeze.
#   album       optional flag: the playlist holds only whole albums. spotdl skips it
#               (.album sentinel); the music-albums flow downloads each album from
#               Usenet instead. See README "Register playlists".
#
# Without a flag the playlist is synced by spotdl, but albums holding
# ALBUM_WANT_MIN or more of its wanted tracks are grabbed whole from Usenet
# by the music-albums flow first; spotdl gets the rest (README "Usenet first").
#
# music-ingest reconciles disk state to this file on every run: it creates new
# playlists' inbox dirs, deletes a removed playlist's store and .m3u, and
# reconciles the .nosync and .album sentinels.
#
# Example:
# liked-songs   https://open.spotify.com/playlist/37i9dQZF1DXcBWIGoYBM5M
# archived-mix  https://open.spotify.com/playlist/37i9dQZF1DXd9rLJfaAKCk  nosync


# The unit tests' root: CI runs `pytest fetch/tests scan/tests service/tests scripts/tests`
# from here. Without this file pytest takes fetch/pyproject.toml's directory as the rootdir
# and never loads ./conftest.py, so the tests ran without their database (homelab#2502).
# The Docker integration tests (tests/pytest.ini) and the MCP adapter's (mcp/) keep their own.
[pytest]

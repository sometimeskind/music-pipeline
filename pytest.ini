# The unit tests' only pytest config, so the repo root is always the rootdir and
# ./conftest.py (the tests' database, homelab#2502) is always loaded: with a config in
# fetch/, scan/ or service/, pytest took that directory as the rootdir and skipped it,
# so those tests fell back to the JSON paths. CI runs `pytest fetch/tests scan/tests
# service/tests scripts/tests`; a bare `pytest` here runs the same. The Docker
# integration tests (tests/pytest.ini) and the MCP adapter's (mcp/) keep their own.
[pytest]
testpaths = fetch/tests scan/tests service/tests scripts/tests

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "music-pipeline-fetch"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []

[project.scripts]
music-ingest = "music_fetch.cli:main"
music-album-reset = "music_fetch.albums:reset_main"
music-album-requeue = "music_fetch.albums:requeue_main"
music-state-import = "music_fetch.state_import:import_main"
music-album-resolve = "music_fetch.state_import:resolve_main"
music-overrides = "music_fetch.overrides_cli:main"
music-requests = "music_fetch.album_requests_cli:main"
music-later = "music_fetch.later_cli:main"
music-state = "music_fetch.state_cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["music_fetch*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
